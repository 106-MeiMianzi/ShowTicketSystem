# spring\u5E94\u7528\u7684\u540D\u79F0
spring.application.name=ShowTicketSystem
# ----------------------------------------
# 1. Spring Boot \u670D\u52A1\u7AEF\u53E3
# \u53EF\u4EE5\u901A\u8FC7http://localhost:8080\u8BBF\u95EE
# ----------------------------------------
server.port=8080

# ----------------------------------------
# 2. MySQL \u6570\u636E\u5E93\u8FDE\u63A5\u914D\u7F6E
# ----------------------------------------
# \u5B9A\u4E49\u4E86\u8FDE\u63A5 MySQL \u7684\u5730\u5740\u548C\u53C2\u6570
# URL \u683C\u5F0F: jdbc:mysql://\u4E3B\u673A\u540D:\u7AEF\u53E3\u53F7/\u6570\u636E\u5E93\u540D?\u53C2\u6570
#jdbc:mysql://localhost:3306/ \u672C\u673Alocalhost\u4E0A\u76843306\u7AEF\u53E3
#show_ticket_system:\u8981\u8FDE\u63A5\u7684\u6570\u636E\u5E93\u540D\u79F0
#useUnicode=true&characterEncoding=utf-8:\u8BBE\u7F6E\u5B57\u7B26\u96C6\u4E3A UTF-8\uFF0C\u786E\u4FDD\u4E2D\u6587\u7B49\u975E\u82F1\u6587\u5B57\u7B26\u4E0D\u4E71\u7801
#serverTimezone=Asia/Shanghai:\u6307\u5B9A\u670D\u52A1\u5668\u65F6\u533A\u4E3A\u4E0A\u6D77\uFF0C\u907F\u514D\u65F6\u95F4\u6233\u5B58\u53D6\u9519\u8BEF
spring.datasource.url=jdbc:mysql://localhost:3306/show_ticket_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
# \u6570\u636E\u5E93\u7528\u6237\u540D: \u4ECE\u73AF\u5883\u53D8\u91CF\u83B7\u53D6\uFF0C\u5982\u679C\u672A\u8BBE\u7F6E\u5219\u4F7F\u7528\u9ED8\u8BA4\u503C
# 数据库用户名: 从环境变量获取，如果未设置则使用默认值root
# 方式1: 设置环境变量 export DB_USERNAME=你的用户名
# 方式2: 直接修改下面的值为你的MySQL用户名（推荐）
spring.datasource.username=root
# 密码: 从环境变量获取，如果未设置则使用空密码
# 方式1: 设置环境变量 export DB_PASSWORD=你的密码
# 方式2: 直接修改下面的值为你的MySQL密码（推荐）
spring.datasource.password=@x20070323

# ----------------------------------------
# 3. MyBatis \u57FA\u7840\u914D\u7F6E
# ----------------------------------------
# \u626B\u63CF Mapper \u63A5\u53E3\u7684\u5305\u8DEF\u5F84
mybatis.mapper-locations=classpath*:/mapper/**/*.xml
# \u5B9E\u4F53\u7C7B\uFF08Entity\uFF09\u6240\u5728\u7684\u5305\u8DEF\u5F84
mybatis.type-aliases-package=com.mianzi.showticketsystem.model.entity
# MyBatis \u914D\u7F6E\uFF1A\u5F00\u542F\u9A7C\u5CF0\u547D\u540D\u81EA\u52A8\u6620\u5C04
mybatis.configuration.map-underscore-to-camel-case=true

# ----------------------------------------
# 4. 邮件服务配置（可选）
# ----------------------------------------
# 如果不需要邮件通知功能，可以不配置
#spring.mail.host=smtp.qq.com
#spring.mail.port=587
#spring.mail.username=your_email@qq.com
#spring.mail.password=your_email_password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ----------------------------------------
# 5. JWT配置
# ----------------------------------------
# JWT密钥（生产环境请修改为更安全的随机字符串）
# 重要：登录与校验必须使用同一密钥。若多环境（本地/测试/线上）并存，各环境 jwt.secret 须一致，
# 否则会出现「Invalid Signature」：例如在测试环境登录拿到的 Token，在本地用本地 secret 校验会失败。
jwt.secret=showticketsystem_secret_key_2024_this_is_a_very_long_secret_key_for_security
# JWT Token过期时间（毫秒），默认24小时
jwt.expiration=86400000
# 为 true 时 401 响应中返回具体原因（签名无效/过期/黑名单等），便于排查；生产环境请设为 false
jwt.debug=true

# ----------------------------------------
# 6. Redis配置
# ----------------------------------------
# Redis服务器地址
spring.data.redis.host=localhost
# Redis服务器端口
spring.data.redis.port=6379
# Redis服务器密码（如果没有密码则留空）
spring.data.redis.password=
# Redis数据库索引（默认为0）
spring.data.redis.database=0
# 连接超时时间（毫秒）
spring.data.redis.timeout=5000
# 连接池最大连接数
spring.data.redis.lettuce.pool.max-active=8
# 连接池最大阻塞等待时间（毫秒）
spring.data.redis.lettuce.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.data.redis.lettuce.pool.max-idle=8
# 连接池中的最小空闲连接
spring.data.redis.lettuce.pool.min-idle=0

# ----------------------------------------
# 7. 微信扫码登录配置（基于测试号）
# ----------------------------------------
# 从微信公众平台测试号系统获取：https://mp.weixin.qq.com/debug/cgi-bin/sandbox?t=sandbox/login
wxlogin.app-id=wxe99d00bb2ad26e47
wxlogin.app-secret=3a5eea05c77408b2e02343bbaf2e8766

# ----------------------------------------
# 8. 支付宝沙箱环境配置（可选）
# ----------------------------------------
# 如果不需要支付功能，可以不配置
# 需要在支付宝开放平台申请沙箱应用获取以下配置
#alipay.appId=your_app_id
#alipay.privateKey=your_private_key
#alipay.publicKey=alipay_public_key
#alipay.serverUrl=https://openapi.alipaydev.com/gateway.do
#alipay.notifyUrl=http://your-domain.com/api/payment/notify
#alipay.returnUrl=http://your-domain.com/payment/return